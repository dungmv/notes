[package]
name = "notes-ffi"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[features]
c-editor = ["dep:base64"]
bindgen = ["uniffi/cargo-metadata", "uniffi/cli"]

[dependencies]
base64 = { version = "0.22.1", optional = true }
serde = "1"
serde_json = "1"
notes-app = { path = "../notes-app" }
notes-sync = { path = "../notes-sync" }
uniffi = { version = "0.33.0", default-features = false, features = ["macro-scaffolding"] }
uuid = { version = "1.24", features = ["v7", "serde"] }

[dev-dependencies]
tempfile = "3.27"

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]
