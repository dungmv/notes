spring:
  application:
    name: notes-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/notes}
    username: ${SPRING_DATASOURCE_USERNAME:notes}
    password: ${SPRING_DATASOURCE_PASSWORD:notes}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health

notes:
  security:
    jwt-secret: ${NOTES_JWT_SECRET:dev-only-change-me-in-production-32-bytes-minimum-secret-key}
    server-pepper: ${NOTES_SERVER_PEPPER:dev-only-server-pepper-change-in-production}
    access-token-ttl-seconds: 900
    refresh-token-ttl-seconds: 2592000
  s3:
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:notes-blobs}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    path-style-access: ${S3_PATH_STYLE:true}
    presign-ttl-seconds: 600
