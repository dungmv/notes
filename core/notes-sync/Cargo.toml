[package]
name = "notes-sync"
version.workspace = true
edition.workspace = true

[dependencies]
base64 = "0.22.1"
notes-crypto = { path = "../notes-crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", features = ["json"] }
uuid = { version = "1.24", features = ["v7", "serde"] }
